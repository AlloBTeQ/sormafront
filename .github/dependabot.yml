# One pull request per ecosystem per run, not one per package.
# Majors ride in the same PR — the Vercel preview build is the gate: if a major
# breaks the build (as lucide-react 1.x did with brand icons), the PR fails
# before anything reaches main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 2
    groups:
      all-npm:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
